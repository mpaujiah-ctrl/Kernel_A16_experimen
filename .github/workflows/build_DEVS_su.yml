name: Recon
on: workflow_dispatch
jobs:
  recon:
    runs-on: ubuntu-22.04
    steps:
      - run: |
          git clone --depth=1 -b lineage-23.2 https://github.com/mpaujiah-ctrl/android_kernel_xiaomi_sm8150_DEVS kernel
          git clone --depth=1 -b builtin https://github.com/mpaujiah-ctrl/SukiSU-Ultra sukisu
          cd sukisu/kernel
          echo "== definisi hook (dengan nama file) =="
          grep -rnE "^(int|void|static int)( __maybe_unused)? ksu_handle_" .
          echo "== peta #if =="
          grep -n "^#if\|^#ifdef\|^#ifndef\|^#else\|^#elif\|^#endif" feature/sucompat.c runtime/ksud.c hook/lsm_hook.c
          echo "== lsm_hook =="
          sed -n 100,175p hook/lsm_hook.c
          echo "== Makefile =="
          head -90 Makefile
